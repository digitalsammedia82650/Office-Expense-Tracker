<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Simple Office Expense Tool</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body { font-family: Arial; background:#f4f6f9; }
.container { max-width:1000px; margin:auto; padding:20px; }

.box {
  background:#fff;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
}

textarea {
  width:100%;
  height:200px;
  padding:10px;
}

.wrap { position:relative; }

.overlay {
  position:absolute;
  top:10px;
  left:10px;
  color:#999;
  pointer-events:none;
  font-size:13px;
  white-space:pre-line;
}

table {
  width:100%;
  border-collapse:collapse;
}
th, td {
  border:1px solid #ccc;
  padding:8px;
}

button { padding:10px; margin-right:10px; }
</style>
</head>

<body>

<div class="container">

<h2>🧾 Simple Office Expense Tool</h2>

<div class="box">
<div class="wrap">
<div id="overlay" class="overlay"></div>
<textarea id="input" placeholder=""></textarea>
</div>
</div>

<div class="box">
<h3>Live Output</h3>
<div id="output"></div>
</div>

<div class="box">
<button onclick="downloadExcel()">Excel</button>
<button onclick="downloadPDF()">PDF</button>
<button onclick="downloadWord()">Word</button>
</div>

</div>

<script>

let schema = [];
let db = [];
let formulas = [];

// ================= SAFE CALC =================
function calc(val){
  if(/^[0-9+\-*/(). ]+$/.test(val)){
    try { return Function('"use strict";return ('+val+')')(); }
    catch { return val; }
  }
  return val;
}

// ================= MAIN PROCESS =================
function process(){

  let text = document.getElementById("input").value.trim();

  let rows = text.split("\n").filter(r=>r.trim());

  db = [];

  // auto detect columns from first row
  if(rows.length > 0){
    let firstCols = rows[0].split(",");
    schema = firstCols.map((_,i)=>"col"+(i+1));
  }

  rows.forEach(r=>{
    let vals = r.split(",").map(v=> calc(v.trim()));
    let obj = {};

    schema.forEach((col,i)=>{
      obj[col] = vals[i] || "";
    });

    db.push(obj);
  });

  render();
  updateOverlay();
}

// ================= INPUT =================
document.getElementById("input").addEventListener("input", process);

// ================= OVERLAY =================
function updateOverlay(){

  let text = document.getElementById("input").value;

  let msg = [];

  if(text.trim()===""){
    msg.push("Type like: 1, coffee, 50");
    msg.push("Comma = next column | Enter = next row");
  } else {
    msg.push("Typing... ✔ Live updating table below");
  }

  document.getElementById("overlay").innerText = msg.join("\n");
}

// ================= RENDER =================
function render(){

  if(schema.length===0) return;

  let html = "<table><tr>";

  schema.forEach(c=> html += `<th>${c}</th>`);
  html += "</tr>";

  db.forEach(r=>{
    html += "<tr>";
    schema.forEach(c=>{
      html += `<td>${r[c]}</td>`;
    });
    html += "</tr>";
  });

  html += "</table>";

  document.getElementById("output").innerHTML = html;
}

// ================= EXPORT =================
function downloadExcel(){

  let ws_data = [schema];

  db.forEach(r=>{
    ws_data.push(schema.map(c=>r[c]));
  });

  let ws = XLSX.utils.aoa_to_sheet(ws_data);
  let wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(wb, ws, "Data");
  XLSX.writeFile(wb, "expenses.xlsx");
}

function downloadPDF(){
  const { jsPDF } = window.jspdf;
  let doc = new jsPDF();
  doc.text(JSON.stringify(db,null,2),10,10);
  doc.save("expenses.pdf");
}

function downloadWord(){
  let html = document.getElementById("output").innerHTML;

  let blob = new Blob(['<html><body>'+html+'</body></html>'], {
    type: 'application/msword'
  });

  let link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "expenses.doc";
  link.click();
}

</script>

</body>
</html>
