<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Expense AI Tool</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body { font-family: Arial; background:#f4f6f9; }
.container { max-width:1100px; margin:auto; padding:20px; }

.box {
  background:#fff;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
}

textarea {
  width:100%;
  height:260px;
  padding:10px;
}

.wrap { position:relative; }

.overlay {
  position:absolute;
  top:10px;
  left:10px;
  color:#999;
  pointer-events:none;
  font-size:13px;
  white-space:pre-line;
}

table {
  width:100%;
  border-collapse:collapse;
}
th, td {
  border:1px solid #ccc;
  padding:8px;
}

button { padding:10px; margin-right:10px; }
</style>
</head>

<body>

<div class="container">

<h2>🧠 Smart Expense AI Tool</h2>

<!-- FORMAT SELECT -->
<div class="box">
<h3>Select Output Format</h3>
<select onchange="setFormat(this.value)">
  <option value="invoice">Invoice</option>
  <option value="expense">Expense</option>
  <option value="ledger">Ledger</option>
  <option value="custom">Custom</option>
</select>
</div>

<!-- INPUT -->
<div class="box">
<h3>Enter Data</h3>
<div class="wrap">
<div id="overlay" class="overlay"></div>
<textarea id="input"></textarea>
</div>
</div>

<!-- OUTPUT -->
<div class="box">
<h3>Live Output</h3>
<div id="output"></div>
</div>

<!-- EXPORT -->
<div class="box">
<button onclick="downloadExcel()">Excel</button>
<button onclick="downloadPDF()">PDF</button>
<button onclick="downloadWord()">Word</button>
</div>

</div>

<script>

// ================= FORMAT TEMPLATES =================
const templates = {

invoice: `#columns: invoice, product, shop, amount, tax, total

#formulas:
tax = amount * 0.18
total = amount + tax

#data:
inv001, pen, store, 100`,

expense: `#columns: item, amount, category, total

#formulas:
total = amount

#data:
coffee, 50, office`,

ledger: `#columns: date, description, amount, balance

#formulas:
balance = prev(balance) + amount

#data:
01-01, opening, 1000`,

custom: `#columns: col1, col2, result

#formulas:
result = col1 + col2

#data:
10, 20`
};

let schema = [];
let formulas = [];
let db = [];

const input = document.getElementById("input");

// ================= SET FORMAT =================
function setFormat(type){
  input.value = templates[type];
  process();
}

// ================= SAFE CALC =================
function calc(val){
  if(/^[0-9+\-*/(). ]+$/.test(val)){
    try { return Function('"use strict";return ('+val+')')(); }
    catch { return val; }
  }
  return val;
}

// ================= PARSE =================
function parseAll(text){

  let lines = text.split("\n");

  let mode = "";
  let dataRows = [];
  let cols = [];

  formulas = [];

  lines.forEach(line=>{
    line = line.trim();

    if(line.startsWith("#columns")){
      mode = "columns";
      cols = line.replace("#columns:","")
        .split(",")
        .map(x=>x.trim())
        .filter(Boolean);
    }

    else if(line.startsWith("#formulas")){
      mode = "formulas";
    }

    else if(line.startsWith("#data")){
      mode = "data";
    }

    else{
      if(mode==="formulas" && line) formulas.push(line);
      if(mode==="data" && line) dataRows.push(line);
    }
  });

  schema = cols;
  return dataRows;
}

// ================= EXTEND SCHEMA =================
function extendSchema(){
  formulas.forEach(f=>{
    let [left] = f.split("=");
    if(left){
      let col = left.trim();
      if(!schema.includes(col)) schema.push(col);
    }
  });
}

// ================= APPLY FORMULAS =================
function applyFormulas(){

  db.forEach((row,i)=>{

    formulas.forEach(f=>{

      let [left, right] = f.split("=");
      if(!left || !right) return;

      let col = left.trim();
      let exp = right.trim();

      exp = exp.replace(/prev\((.*?)\)/g, (_,v)=>{
        return db[i-1] ? Number(db[i-1][v] || 0) : 0;
      });

      schema.forEach(s=>{
        exp = exp.replaceAll(s, Number(row[s] || 0));
      });

      try{
        row[col] = Function('"use strict";return ('+exp+')')();
      }catch{}
    });

  });

}

// ================= PROCESS =================
function process(){

  let text = input.value;

  let rows = parseAll(text);
  db = [];

  rows.forEach(r=>{
    let vals = r.split(",").map(v=> calc(v.trim()));
    let obj = {};

    schema.forEach((col,i)=>{
      obj[col] = vals[i] || "";
    });

    db.push(obj);
  });

  extendSchema();
  applyFormulas();

  render();
  updateOverlay(text);
}

// ================= INPUT LISTENER =================
input.addEventListener("input", process);

// ================= OVERLAY =================
function updateOverlay(text){

  let msg = [];

  if(text.trim()===""){
    msg.push("Use: #columns → #formulas → #data");
    msg.push("Comma = column | Enter = row");
  }

  msg.push(
    (text.includes("#columns")?"columns ✔":"columns ⏳")+" | "+
    (text.includes("#formulas")?"formulas ✔":"formulas ⏳")+" | "+
    (text.includes("#data")?"data ✔":"data ⏳")
  );

  document.getElementById("overlay").innerText = msg.join("\n");
}

// ================= RENDER =================
function render(){

  if(schema.length===0) return;

  let html = "<table><tr>";
  schema.forEach(c=> html += `<th>${c}</th>`);
  html += "</tr>";

  db.forEach(r=>{
    html += "<tr>";
    schema.forEach(c=>{
      html += `<td>${r[c]||""}</td>`;
    });
    html += "</tr>";
  });

  html += "</table>";

  document.getElementById("output").innerHTML = html;
}

// ================= EXPORT =================
function downloadExcel(){

  let ws_data = [schema];
  db.forEach(r=>{
    ws_data.push(schema.map(c=>r[c]||""));
  });

  let ws = XLSX.utils.aoa_to_sheet(ws_data);
  let wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Data");
  XLSX.writeFile(wb, "data.xlsx");
}

function downloadPDF(){
  const { jsPDF } = window.jspdf;
  let doc = new jsPDF();
  doc.text(JSON.stringify(db,null,2),10,10);
  doc.save("data.pdf");
}

function downloadWord(){
  let html = document.getElementById("output").innerHTML;
  let blob = new Blob(['<html><body>'+html+'</body></html>'], {
    type: 'application/msword'
  });

  let link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "data.doc";
  link.click();
}

// INIT
setFormat("invoice");

</script>

</body>
</html>
