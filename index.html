<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Universal Office Expense AI Tool</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body { font-family: Arial; background:#f4f6f9; }
.container { max-width:1100px; margin:auto; padding:20px; }

.box {
  background:#fff;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
}

.wrap { position:relative; }

textarea {
  width:100%;
  height:220px;
  padding:40px 10px 10px 10px;
}

.overlay {
  position:absolute;
  top:45px;
  left:10px;
  color:#999;
  font-size:13px;
  pointer-events:none;
}

.controls {
  position:absolute;
  top:5px;
  right:5px;
}

.controls button {
  margin-left:5px;
  font-size:12px;
}

table {
  width:100%;
  border-collapse:collapse;
}
th, td {
  border:1px solid #ccc;
  padding:8px;
}
</style>
</head>

<body>

<div class="container">

<h2>🧾 Universal Office Expense AI Tool</h2>

<div class="box">
<input id="company" placeholder="Company Name" style="width:100%; padding:10px;">
</div>

<div class="box">
<div class="wrap">

<div class="controls">
<button onclick="addSample()">⚡ Sample</button>
<button onclick="clearAll()">🧹</button>
</div>

<div id="overlay" class="overlay"></div>
<textarea id="input"></textarea>

</div>
</div>

<div class="box">
<div id="output"></div>
</div>

<div class="box">
<button onclick="downloadExcel()">Excel</button>
<button onclick="downloadPDF()">PDF</button>
<button onclick="downloadWord()">Word</button>
</div>

</div>

<script>

let db = [];

// ================= HELPERS =================
function isDate(v){
  return /\d{1,2}[-\/]\d{1,2}[-\/]\d{2,4}/.test(v);
}

function isInvoice(v){
  return /inv|bill|#/i.test(v);
}

function isNumber(v){
  return !isNaN(v);
}

// ================= PROCESS =================
function process(){

  let text = document.getElementById("input").value.trim();
  let rows = text.split("\n").filter(r=>r.trim());

  db = [];
  let total = 0;
  let balance = 0;

  rows.forEach(r=>{

    let vals = r.split(",").map(v=>v.trim());
    let obj = {
      Invoice:"", Date:"", Item:"", Qty:"",
      Rate:"", Amount:"", Shop:"", Notes:""
    };

    vals.forEach(v=>{

      if(isInvoice(v)) obj.Invoice = v;
      else if(isDate(v)) obj.Date = v;
      else if(isNumber(v)){
        if(!obj.Qty) obj.Qty = v;
        else if(!obj.Rate) obj.Rate = v;
        else obj.Amount = v;
      }
      else{
        if(!obj.Item) obj.Item = v;
        else if(!obj.Shop) obj.Shop = v;
        else obj.Notes = v;
      }

    });

    // Auto amount
    if(obj.Qty && obj.Rate && !obj.Amount){
      obj.Amount = obj.Qty * obj.Rate;
    }

    obj.Amount = Number(obj.Amount || 0);

    total += obj.Amount;
    balance += obj.Amount;
    obj.Balance = balance;

    db.push(obj);

  });

  render(total);
  updateOverlay();
}

// ================= INPUT =================
document.getElementById("input").addEventListener("input", process);

// ================= OVERLAY =================
function updateOverlay(){

  let text = document.getElementById("input").value;

  let msg = [];

  if(text.trim()===""){
    msg.push("Type: inv45, 12-05-2026, coffee, 2, 50");
    msg.push("OR simple: coffee, 50");
  } else {
    msg.push("Auto detecting fields...");
  }

  document.getElementById("overlay").innerText = msg.join("\n");
}

// ================= RENDER =================
function render(total){

  let company = document.getElementById("company").value;

  let html = `<h3>${company || "Company Name"}</h3>`;

  html += "<table><tr>";
  let cols = ["Invoice","Date","Item","Qty","Rate","Amount","Shop","Balance"];
  cols.forEach(c=> html += `<th>${c}</th>`);
  html += "</tr>";

  db.forEach(r=>{
    html += "<tr>";
    cols.forEach(c=>{
      html += `<td>${r[c]||""}</td>`;
    });
    html += "</tr>";
  });

  html += "</table>";

  html += `<b>Total: ${total}</b>`;

  document.getElementById("output").innerHTML = html;
}

// ================= EXPORT =================
function downloadExcel(){

  let cols = ["Invoice","Date","Item","Qty","Rate","Amount","Shop","Balance"];
  let ws_data = [cols];

  db.forEach(r=>{
    ws_data.push(cols.map(c=>r[c]));
  });

  let ws = XLSX.utils.aoa_to_sheet(ws_data);
  let wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(wb, ws, "Data");
  XLSX.writeFile(wb, "data.xlsx");
}

function downloadPDF(){
  const { jsPDF } = window.jspdf;
  let doc = new jsPDF();
  doc.text(document.getElementById("output").innerText,10,10);
  doc.save("data.pdf");
}

function downloadWord(){
  let html = document.getElementById("output").innerHTML;

  let blob = new Blob(['<html><body>'+html+'</body></html>'], {
    type: 'application/msword'
  });

  let link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "data.doc";
  link.click();
}

// ================= BUTTONS =================
function addSample(){
  input.value = "inv45, 12-05-2026, coffee, 2, 50, shop1\ncoffee, 30";
  process();
}

function clearAll(){
  input.value = "";
  process();
}

</script>

</body>
</html>
