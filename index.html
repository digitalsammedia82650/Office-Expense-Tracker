<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Office Expense Pro AI Tool</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body { font-family: Arial; background:#f4f6f9; }
.container { max-width:1100px; margin:auto; padding:20px; }

.box {
  background:#fff;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
}

.wrap { position:relative; }

textarea {
  width:100%;
  height:220px;
  padding:40px 10px 10px 10px;
  font-size:14px;
}

.overlay {
  position:absolute;
  top:45px;
  left:10px;
  color:#999;
  pointer-events:none;
  font-size:13px;
}

.controls {
  position:absolute;
  top:5px;
  right:5px;
}

.controls button {
  margin-left:5px;
  font-size:12px;
  padding:5px;
}

table {
  width:100%;
  border-collapse:collapse;
}
th, td {
  border:1px solid #ccc;
  padding:8px;
}

button { cursor:pointer; }
</style>
</head>

<body>

<div class="container">

<h2>🧾 Office Expense Pro AI Tool</h2>

<div class="box">
<input id="company" placeholder="Company Name" style="width:100%; padding:10px;">
</div>

<div class="box">
<select id="format" onchange="changeFormat()">
  <option value="expense">Expense</option>
  <option value="invoice">Invoice</option>
  <option value="ledger">Ledger</option>
  <option value="custom">Custom</option>
</select>
</div>

<div class="box">
<div class="wrap">

<!-- BUTTONS -->
<div class="controls">
  <button onclick="addColumn()">➕ Column</button>
  <button onclick="addFormula()">🧮 Formula</button>
  <button onclick="addSample()">⚡ Sample</button>
  <button onclick="clearAll()">🧹</button>
</div>

<div id="overlay" class="overlay"></div>
<textarea id="input"></textarea>

</div>
</div>

<div class="box">
<div id="output"></div>
</div>

<div class="box">
<button onclick="downloadExcel()">Excel</button>
<button onclick="downloadPDF()">PDF</button>
<button onclick="downloadWord()">Word</button>
</div>

</div>

<script>

let schema = [];
let db = [];
let format = "expense";
let formulas = [];

const formats = {
  expense: ["SL","Item","Amount"],
  invoice: ["Invoice","Product","Shop","Amount"],
  ledger: ["Date","Description","Amount","Balance"]
};

// ================= BUTTON ACTIONS =================

function addColumn(){
  let col = prompt("Enter column name:");
  if(!col) return;

  let text = input.value;
  if(!text.includes("#columns")){
    input.value = "#columns: " + col + "\n\n#data:\n";
  } else {
    input.value = text.replace("#columns:", "#columns: " + col + ", ");
  }
  process();
}

function addFormula(){
  let f = prompt("Enter formula (example: total = amount * 2)");
  if(!f) return;

  let text = input.value;
  if(!text.includes("#formulas")){
    input.value += "\n#formulas:\n" + f;
  } else {
    input.value += "\n" + f;
  }
  process();
}

function addSample(){
  input.value = "1, coffee, 50\n2, tea, 30";
  process();
}

function clearAll(){
  input.value = "";
  process();
}

// ================= FORMAT =================
function changeFormat(){
  format = document.getElementById("format").value;
  if(format !== "custom"){
    schema = formats[format];
  }
  process();
}

// ================= PROCESS =================
function process(){

  let text = input.value.trim();
  let rows = text.split("\n").filter(r=>r.trim());

  db = [];
  let total = 0;

  rows.forEach((r,i)=>{

    if(r.startsWith("#")) return;

    let vals = r.split(",").map(v=>v.trim());
    let obj = {};

    schema.forEach((col,index)=>{
      obj[col] = vals[index] || "";
    });

    if(format === "expense" || format === "invoice"){
      total += Number(obj["Amount"]||0);
    }

    if(format === "ledger"){
      let prev = db[i-1]?.Balance || 0;
      obj["Balance"] = Number(prev) + Number(obj["Amount"]||0);
    }

    db.push(obj);
  });

  render(total);
  updateOverlay();
}

// ================= INPUT =================
const input = document.getElementById("input");
input.addEventListener("input", process);

// ================= OVERLAY =================
function updateOverlay(){

  let text = input.value;

  let msg = [];

  if(text.trim()===""){
    msg.push("Type: 1, coffee, 50");
    msg.push("Comma = next column");
  } else {
    msg.push("Live updating...");
  }

  document.getElementById("overlay").innerText = msg.join("\n");
}

// ================= RENDER =================
function render(total){

  let company = document.getElementById("company").value;

  let html = `<h3>${company || "Company Name"}</h3>`;

  html += "<table><tr>";
  schema.forEach(c=> html += `<th>${c}</th>`);
  html += "</tr>";

  db.forEach(r=>{
    html += "<tr>";
    schema.forEach(c=>{
      html += `<td>${r[c]||""}</td>`;
    });
    html += "</tr>";
  });

  html += "</table>";

  if(format !== "ledger"){
    html += `<b>Total: ${total}</b>`;
  }

  document.getElementById("output").innerHTML = html;
}

// ================= EXPORT =================
function downloadExcel(){

  let ws_data = [schema];

  db.forEach(r=>{
    ws_data.push(schema.map(c=>r[c]));
  });

  let ws = XLSX.utils.aoa_to_sheet(ws_data);
  let wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(wb, ws, "Data");
  XLSX.writeFile(wb, "data.xlsx");
}

function downloadPDF(){
  const { jsPDF } = window.jspdf;
  let doc = new jsPDF();
  doc.text(document.getElementById("output").innerText,10,10);
  doc.save("data.pdf");
}

function downloadWord(){
  let html = document.getElementById("output").innerHTML;

  let blob = new Blob(['<html><body>'+html+'</body></html>'], {
    type: 'application/msword'
  });

  let link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "data.doc";
  link.click();
}

// INIT
changeFormat();

</script>

</body>
</html>
